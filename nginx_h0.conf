# nginx_h0.conf — standalone nginx for the h0 victim (IPv6, high backlog).
#
# Launched INSIDE h0's mininet namespace by server_nginx.py. This does NOT use
# the systemd nginx service (that runs in the root namespace = wrong network).
# All runtime paths live under /tmp so this instance never clashes with any
# system nginx.
#
# Purpose: complete legitimate handshakes even under a 60-host flash crowd, so
# the detector stops seeing server-induced incomplete connections (a
# single-threaded Python server chokes under load).

user  root;
worker_processes  auto;
pid  /tmp/nginx_h0.pid;
error_log  /tmp/nginx_h0_error.log  crit;

events {
    worker_connections  8192;
    multi_accept  on;
}

http {
    access_log  off;

    # keep every temp dir under /tmp (writable, no clash with a system nginx)
    client_body_temp_path  /tmp/nginx_h0/body;
    proxy_temp_path        /tmp/nginx_h0/proxy;
    fastcgi_temp_path      /tmp/nginx_h0/fcgi;
    uwsgi_temp_path        /tmp/nginx_h0/uwsgi;
    scgi_temp_path         /tmp/nginx_h0/scgi;

    server {
        # IPv6 wildcard, deep accept backlog, SO_REUSEPORT for multi-worker accept
        listen  [::]:80  backlog=8192  reuseport;

        location / {
            default_type  text/plain;
            return  200  "OK";
        }
    }
}
