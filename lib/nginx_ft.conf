# nginx for Clos server hosts (IPv6, access log -> stdout). No `pid` here: it is
# passed per-host via `nginx -g` so all 8 servers can share this one file.
user  root;
worker_processes  auto;
error_log  /tmp/nginx_ft_error.log  crit;

events { worker_connections 8192; multi_accept on; }

http {
    log_format  simple  '$remote_addr -> $status ($request)';   # one line per request
    access_log  /dev/stdout  simple;

    client_body_temp_path  /tmp/nginx_ft/body;
    proxy_temp_path        /tmp/nginx_ft/proxy;
    fastcgi_temp_path      /tmp/nginx_ft/fcgi;
    uwsgi_temp_path        /tmp/nginx_ft/uwsgi;
    scgi_temp_path         /tmp/nginx_ft/scgi;

    server {
        listen  [::]:80  backlog=8192  reuseport;
        location / { default_type text/plain; return 200 "OK"; }
    }
}
